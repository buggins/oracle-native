name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.dc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, dc: dmd-latest }
          - { os: ubuntu-latest, dc: ldc-latest }
          # Minimum supported D frontend: 2.097 (the same as ddbc)
          - { os: ubuntu-latest, dc: dmd-2.097.2 }
          - { os: ubuntu-latest, dc: ldc-1.27.1 }
          - { os: windows-latest, dc: dmd-latest }
          - { os: windows-latest, dc: ldc-latest }
          # DMD does not target arm64 macOS runners
          - { os: macos-latest, dc: ldc-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2.0.0
        with:
          compiler: ${{ matrix.dc }}
      - name: Cache dub packages and builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/.dub/cache
            ~/AppData/Local/dub/packages
            ~/AppData/Local/dub/cache
          key: dub-${{ github.job }}-${{ runner.os }}-${{ matrix.dc }}-${{ hashFiles('**/dub.json') }}
          restore-keys: dub-${{ github.job }}-${{ runner.os }}-${{ matrix.dc }}-
      - name: Build
        run: dub build
      - name: Unit tests
        run: dub test

  integration:
    name: server (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Oracle 23ai Free", image: "gvenzl/oracle-free:23-slim-faststart", service: FREEPDB1 }
          - { name: "Oracle 21c XE", image: "gvenzl/oracle-xe:21-slim-faststart", service: XEPDB1 }
          - { name: "Oracle 18c XE", image: "gvenzl/oracle-xe:18-slim-faststart", service: XEPDB1 }
    services:
      oracle:
        image: ${{ matrix.image }}
        env:
          ORACLE_PASSWORD: Oracle_test123
          APP_USER: testuser
          APP_USER_PASSWORD: Test_password123
        ports:
          - 1521:1521
        options: >-
          --health-cmd /opt/oracle/healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
    env:
      ORACLE_HOST: localhost:1521
      ORACLE_SERVICE: ${{ matrix.service }}
      ORACLE_USER: testuser
      ORACLE_PASSWORD: Test_password123
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2.0.0
        with:
          compiler: ldc-latest
      - name: Server is reachable
        run: |
          docker exec ${{ job.services.oracle.id }} bash -c \
            "echo 'SELECT banner FROM v\$version;' | sqlplus -s testuser/Test_password123@${{ matrix.service }}"
      - name: Build
        run: dub build
      # Integration tests (thread and fiber runners) come with O1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2.0.0
        with:
          compiler: ldc-latest
      - name: Cache dub packages and builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/.dub/cache
          key: dub-${{ github.job }}-${{ runner.os }}-ldc-latest-${{ hashFiles('**/dub.json') }}
          restore-keys: dub-${{ github.job }}-${{ runner.os }}-ldc-latest-
      - name: D-Scanner style check
        run: dub run -q dscanner@0.15.2 -- --styleCheck .
      - name: dfmt formatting check
        run: |
          dub run -q dfmt@0.15.2 -- --inplace $(git ls-files '*.d')
          git diff --exit-code
      - name: Documentation builds
        run: dub build -b docs
